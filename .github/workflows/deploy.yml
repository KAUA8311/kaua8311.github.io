name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A310BA: ${{ secrets.A310BA }}
          BA6CF1: ${{ secrets.BA6CF1 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A310BA', '')
          bm = os.environ.get('BA6CF1', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 9db6b04dbf954c235335fabd -->', gm)
          if bm:
              s2 = s2.replace('<!-- 166affa3e8db1efaeabe572767 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
